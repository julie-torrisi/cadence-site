name: Update AI output stats

on:
  schedule:
    - cron: "17 10 * * *"   # daily, ~6:17 AM Eastern
  workflow_dispatch:         # "Run workflow" button for an instant refresh
  push:
    paths:
      - "data/ship-log.json"
      - "scripts/build-stats.mjs"

permissions:
  contents: write

concurrency:
  group: ai-output-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build stats
        run: node scripts/build-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/stats.json; then
            echo "No changes"
          else
            git config user.name "ai-output-bot"
            git config user.email "ai-output-bot@users.noreply.github.com"
            git add data/stats.json
            git commit -m "Update AI output stats [skip ci]"
            git push
          fi
